<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A dark field. A dashed gold gate labelled Stop If Unclear catches the odd-shaped cases, while one ordinary case travels the lane straight through the gate and flares bright on the far side.">
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#F6DFA8" stop-opacity="1"/>
      <stop offset="35%" stop-color="#E8B23A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E8B23A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lane" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="1120" y2="0">
      <stop offset="0%" stop-color="#C28A1E" stop-opacity="0.15"/>
      <stop offset="14%" stop-color="#C28A1E" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#E8B23A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#E8B23A" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="dim" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="1120" y2="0">
      <stop offset="0%" stop-color="#484848" stop-opacity="0"/>
      <stop offset="30%" stop-color="#484848" stop-opacity="1"/>
      <stop offset="70%" stop-color="#484848" stop-opacity="1"/>
      <stop offset="100%" stop-color="#484848" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#1a1a1a"/>

  <!-- quiet lanes -->
  <g stroke="url(#dim)" stroke-width="1">
    <line x1="80" y1="160" x2="1120" y2="160"/>
    <line x1="80" y1="235" x2="1120" y2="235"/>
    <line x1="80" y1="395" x2="1120" y2="395"/>
    <line x1="80" y1="470" x2="1120" y2="470"/>
  </g>

  <!-- odd-shaped cases, caught and turned away at the gate -->
  <g fill="#4a4a4a">
    <path d="M470 148 l20 -16 l17 18 l22 -7 l-7 24 l11 20 l-24 4 l-13 18 l-16 -18 l-24 0 l7 -22 z"/>
    <path d="M500 224 l19 -14 l16 17 l23 -8 l-8 25 l9 18 l-24 6 l-11 16 l-17 -18 l-22 2 l9 -24 z"/>
    <path d="M492 384 l17 -15 l19 15 l22 -5 l-9 24 l11 18 l-24 6 l-11 17 l-17 -17 l-22 0 l9 -22 z"/>
    <path d="M466 460 l19 -13 l17 15 l23 -7 l-8 24 l11 20 l-25 4 l-11 17 l-15 -19 l-22 2 l7 -22 z"/>
  </g>
  <g stroke="#4a4a4a" stroke-width="1.5" fill="none" opacity="0.85">
    <path d="M540 152 q44 -14 52 -54"/>
    <path d="M552 232 q42 -16 44 -58"/>
    <path d="M556 396 q40 16 40 56"/>
    <path d="M540 476 q50 14 54 54"/>
  </g>

  <!-- the gate -->
  <line x1="600" y1="120" x2="600" y2="512" stroke="#C28A1E" stroke-width="2" stroke-dasharray="9 9" opacity="0.85"/>
  <text x="600" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" letter-spacing="4" fill="#C28A1E">STOP IF UNCLEAR</text>

  <!-- the lane that passes -->
  <line x1="80" y1="315" x2="1120" y2="315" stroke="url(#lane)" stroke-width="2.5"/>
  <g fill="#E8B23A">
    <circle cx="220" cy="315" r="5" opacity="0.4"/>
    <circle cx="330" cy="315" r="5" opacity="0.55"/>
    <circle cx="440" cy="315" r="5" opacity="0.7"/>
    <circle cx="550" cy="315" r="5" opacity="0.85"/>
    <circle cx="680" cy="315" r="5.5" opacity="0.95"/>
    <circle cx="770" cy="315" r="6" opacity="1"/>
  </g>
  <circle cx="860" cy="315" r="86" fill="url(#glow)"/>
  <circle cx="860" cy="315" r="11" fill="#F6DFA8"/>
  <circle cx="860" cy="315" r="34" fill="none" stroke="#E8B23A" stroke-width="1" opacity="0.5"/>
</svg>
